name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# A new push to a pull request cancels its previous run; other events run
# every commit. The workflow name keeps workflows from cancelling each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: cargo build --all-targets --locked
      - run: cargo test --locked
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt
      - run: cargo fmt --check
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - run: cargo clippy --all-targets --locked -- -D warnings
  workflow-skills:
    name: Workflow Skills
    runs-on: ubuntu-latest
    steps:
      # The check runs agent-kit main; keep the job token out of .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/validate-workflow-skills.sh
  release-scripts:
    name: Release scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: bash scripts/validate-release.sh
  deny:
    name: Licenses & advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
      # Optional backends are gated on their own: every feature enabled.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check licenses
          arguments: --all-features
  static:
    name: Static binary, offline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: make static
      - name: The binary is static
        run: file target/x86_64-unknown-linux-musl/release/ezu | grep -E "static(ally|-pie) linked"
      # Run it with no network but loopback, and check it serves.
      - name: It runs with networking disabled
        run: bash scripts/offline-check.sh target/x86_64-unknown-linux-musl/release/ezu
  bench:
    name: Benchmark smoke (10^6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: cargo build --release --locked --bin ezu-bench
      - run: ./target/release/ezu-bench --entities 1000000

  # Proto compatibility against the last final v* tag (proto/buf.yaml sets the
  # rules). A reported break passes only when the pull request is marked
  # breaking (`type!:` subject or a Breaking/Upgrade section, see
  # AGENTS.md) and labelled `risk:breaking`; a tool failure stays red.
  proto-breaking:
    name: Proto breaking
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          version: 1.75.0
          setup_only: true
      - name: buf breaking
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          tag="$(git describe --tags --abbrev=0 --match 'v*' --exclude '*-*' "$BASE" 2>/dev/null || true)"
          if [[ -z "$tag" ]]; then
            echo "::notice::No final v* tag yet; nothing to compare against."
            exit 0
          fi
          if ! git cat-file -e "${tag}:proto" 2>/dev/null; then
            echo "::notice::${tag} has no proto/ directory; nothing to compare against."
            exit 0
          fi
          rc=0
          out="$(buf breaking proto --against ".git#tag=${tag},subdir=proto" --error-format github-actions 2>&1)" || rc=$?
          echo "$out"
          [[ $rc -eq 0 ]] && exit 0
          # buf exits 100 for reported incompatibilities; anything else is a tool error.
          if [[ $rc -ne 100 ]]; then
            echo "::error::buf breaking failed without reporting a break (exit ${rc}); see the log."
            exit "$rc"
          fi
          # Read the live title, body, and labels so an edit plus a re-run is enough.
          pr="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json title,body,labels)"
          title="$(jq -r .title <<<"$pr")"
          body="$(jq -r .body <<<"$pr")"
          bang='^[a-z]+(\([^)]*\))?!:'
          marked=false
          if [[ "$title" =~ $bang ]] || grep -qE '^(BREAKING[ -]CHANGE|#+ *(Breaking|Upgrade))' <<<"$body"; then
            marked=true
          fi
          labelled="$(jq '[.labels[].name] | index("risk:breaking") != null' <<<"$pr")"
          if [[ "$marked" == true && "$labelled" == true ]]; then
            echo "::notice::Proto break against ${tag} accepted: the pull request is marked breaking and labelled risk:breaking."
            exit 0
          fi
          echo "::error::buf breaking found incompatible proto changes against ${tag}. Mark the pull request breaking (a 'type!:' title or a '## Breaking' section) and add the risk:breaking label, or keep the change compatible."
          exit 1
