name: Release

# Runs from main for a signed tag. release-dispatch.yml starts it on a v* tag
# push; a failed run is fixed on main and re-run for the same tag. Pull
# requests and workflow_dispatch without a tag dry-run the packaging path and
# never mint attestations or touch a GitHub Release.
on:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/release-dispatch.yml"
      - "scripts/verify-release-tag.sh"
      - "scripts/changelog-notes.py"
      - "scripts/release-manifest.py"
      - "scripts/release-sbom.py"
      - "scripts/release-package.sh"
      - "scripts/tenkai-profile.py"
      - "scripts/validate-release.sh"
      - "deploy/tenkai.toml"
      - "scripts/changelog-draft.sh"
      - "security/release-tag-key.asc"
      - "security/release-tag-fingerprints"
      - "RELEASING.md"
      - "CHANGELOG.md"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
  workflow_dispatch:
    inputs:
      tag:
        description: Signed vX.Y.Z or vX.Y.Z-rc.N tag to release from main; empty for a dry run
        required: false
        default: ""
        type: string

# One run per tag. A second dispatch for the same tag waits for the first.
concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  scripts:
    name: Release scripts
    needs: verify-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-tag.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true
      - name: Require HEAD at the release commit
        env:
          SHA: ${{ needs.verify-tag.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$SHA"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: bash scripts/validate-release.sh

  # Resolves the release commit every later job checks out. A tagged run must
  # come from main: main's verify-release-tag.sh and allowed keys verify the
  # signed tag against the tagged commit's Cargo.toml, and that commit must be
  # on main. A dry run resolves the checked-out commit and verifies nothing.
  verify-tag:
    name: Verify signed tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - name: Refuse a tagged run that is not from main
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$WORKFLOW_REF" == refs/heads/main ]] || { echo "tagged release runs must start from refs/heads/main, not ${WORKFLOW_REF}" >&2; exit 1; }
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(rc|beta)\.[0-9]+)?$ ]] || { echo "invalid release tag: ${TAG}" >&2; exit 1; }
      - name: Check out main's release-tag verifier
        if: inputs.tag != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: main-tree
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}
          path: source
          fetch-depth: 0
          fetch-tags: true
      - name: Verify the signed tag on main
        if: inputs.tag != ''
        working-directory: source
        env:
          TAG: ${{ inputs.tag }}
          MAIN_TREE: ${{ github.workspace }}/main-tree
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}" "+refs/heads/main:refs/remotes/origin/main"
          sha="$(git rev-parse "${TAG}^{commit}")"
          RELEASE_ROOT="$PWD" \
            RELEASE_TAG_KEY="${MAIN_TREE}/security/release-tag-key.asc" \
            RELEASE_TAG_FINGERPRINTS="${MAIN_TREE}/security/release-tag-fingerprints" \
            bash "${MAIN_TREE}/scripts/verify-release-tag.sh" verify "$TAG" "$sha"
          git merge-base --is-ancestor "$sha" refs/remotes/origin/main || { echo "tag ${TAG} commit ${sha} is not on main" >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$sha"
      - name: Refuse a published release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # Only "release not found" or a draft may continue; any other
          # answer from gh fails the run.
          if state="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>&1)"; then
            [[ "$state" == true ]] || { echo "release ${TAG} is already published; cut a new tag instead of re-running" >&2; exit 1; }
          elif [[ "$state" != *"release not found"* ]]; then
            echo "cannot read release ${TAG}: ${state}" >&2
            exit 1
          fi
      - name: Resolve release commit
        id: resolve
        working-directory: source
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          echo "tag=${TAG}" >>"$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >>"$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >>"$GITHUB_OUTPUT"
          fi

  package:
    name: Package artifacts
    runs-on: ubuntu-latest
    needs: [scripts, verify-tag]
    permissions:
      contents: read
      # release-package.sh reads merged pull requests for manifest gate flags.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-tag.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true
      - name: Require HEAD at the release commit
        env:
          SHA: ${{ needs.verify-tag.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$SHA"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: musl tools for the static image
        if: needs.verify-tag.outputs.tag != ''
        # Builds the tagged commit; tags cut before scripts/apt-install.sh
        # install without retries.
        run: |
          if [ -x scripts/apt-install.sh ]; then
            scripts/apt-install.sh musl-tools
          else
            sudo apt-get update && sudo apt-get install -y musl-tools
          fi
      - name: Package
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify-tag.outputs.tag }}
          SHA: ${{ needs.verify-tag.outputs.sha }}
        run: |
          extra=(--git-sha "$SHA")
          if [[ -n "$TAG" ]]; then
            extra+=(--tag "$TAG" --with-images)
          else
            extra+=(--skip-test)
          fi
          bash scripts/release-package.sh --out dist "${extra[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ezu-release
          path: dist/
          if-no-files-found: error

  push-image:
    name: Push release image
    needs: [verify-tag, package]
    if: needs.verify-tag.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Refuse a published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify-tag.outputs.tag }}
        run: |
          set -euo pipefail
          # "Re-run failed jobs" reuses verify-tag's outputs, so check again
          # here. Only "release not found" or a draft may continue.
          if state="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>&1)"; then
            [[ "$state" == true ]] || { echo "release ${TAG} is already published; cut a new tag instead of re-running" >&2; exit 1; }
          elif [[ "$state" != *"release not found"* ]]; then
            echo "cannot read release ${TAG}: ${state}" >&2
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ezu-release
          path: dist
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Load, tag, and push
        env:
          TAG: ${{ needs.verify-tag.outputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          image="ghcr.io/sannrox/ezu:${version}"
          tar="dist/ezu-${version}-image.tar"
          [[ -f "$tar" ]] || { echo "missing ${tar}" >&2; exit 1; }
          docker load -i "$tar"
          docker tag "ezu:v${version}" "$image"
          docker push "$image"

  attest:
    name: Attest artifacts
    needs: [verify-tag, package]
    if: needs.verify-tag.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      attestation-url: ${{ steps.provenance.outputs.attestation-url }}
      sbom-attestation-url: ${{ steps.sbom.outputs.attestation-url }}
    steps:
      - name: Refuse a published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify-tag.outputs.tag }}
        run: |
          set -euo pipefail
          # "Re-run failed jobs" reuses verify-tag's outputs, so check again
          # here. Only "release not found" or a draft may continue.
          if state="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>&1)"; then
            [[ "$state" == true ]] || { echo "release ${TAG} is already published; cut a new tag instead of re-running" >&2; exit 1; }
          elif [[ "$state" != *"release not found"* ]]; then
            echo "cannot read release ${TAG}: ${state}" >&2
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ezu-release
          path: dist
      - name: Attest provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/ezu-[0-9]*
            dist/*-image.tar
            dist/SHA256SUMS
            dist/ezu.cdx.json
      - name: Attest SBOM
        id: sbom
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            dist/ezu-[0-9]*
            dist/*-image.tar
            dist/SHA256SUMS
          sbom-path: dist/ezu.cdx.json

  # Drafts, uploads, then publishes last, after every asset is attested, so a
  # failed run leaves a draft that a re-run for the same tag resumes.
  publish:
    name: GitHub Release
    needs: [verify-tag, package, attest, push-image]
    if: needs.verify-tag.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-tag.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true
      - name: Require HEAD at the release commit
        env:
          SHA: ${{ needs.verify-tag.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$SHA"
      - name: Refuse a published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify-tag.outputs.tag }}
        run: |
          set -euo pipefail
          # "Re-run failed jobs" reuses verify-tag's outputs, so check again
          # here. Only "release not found" or a draft may continue.
          if state="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>&1)"; then
            [[ "$state" == true ]] || { echo "release ${TAG} is already published; cut a new tag instead of re-running" >&2; exit 1; }
          elif [[ "$state" != *"release not found"* ]]; then
            echo "cannot read release ${TAG}: ${state}" >&2
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ezu-release
          path: dist
      - name: Record attestation URLs on the manifest
        env:
          PROVENANCE_URL: ${{ needs.attest.outputs.attestation-url }}
          SBOM_URL: ${{ needs.attest.outputs.sbom-attestation-url }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          path = pathlib.Path("dist/ezu-release.json")
          manifest = json.loads(path.read_text())
          urls = [u for u in (os.environ.get("PROVENANCE_URL"), os.environ.get("SBOM_URL")) if u]
          manifest["attestations"] = urls
          path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n")
          PY
      - name: Notes from CHANGELOG
        env:
          TAG: ${{ needs.verify-tag.outputs.tag }}
        run: python3 scripts/changelog-notes.py "${TAG#v}" > dist/RELEASE_NOTES.md
      - name: Draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify-tag.outputs.tag }}
          PRERELEASE: ${{ needs.verify-tag.outputs.prerelease }}
        run: |
          set -euo pipefail
          # A tag with a "-" (vX.Y.Z-rc.N) is a pre-release and never latest.
          kind=()
          if [[ "$PRERELEASE" == true ]]; then
            kind=(--prerelease --latest=false)
          fi
          # A re-run resumes its draft; a published release is never touched.
          if state="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>&1)"; then
            [[ "$state" == true ]] || { echo "release ${TAG} is already published; cut a new tag instead of re-running" >&2; exit 1; }
            # Every dispatch rebuilds every asset; drop the earlier run's so
            # a renamed or removed asset is not published.
            gh release view "$TAG" --json assets --jq '.assets[].name' | while IFS= read -r name; do
              gh release delete-asset "$TAG" "$name" --yes
            done
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --title "$TAG" --notes-file dist/RELEASE_NOTES.md --draft "${kind[@]}"
          elif [[ "$state" == *"release not found"* ]]; then
            gh release create "$TAG" dist/* \
              --draft \
              --verify-tag \
              "${kind[@]}" \
              --title "$TAG" \
              --notes-file dist/RELEASE_NOTES.md
          else
            echo "cannot read release ${TAG}: ${state}" >&2
            exit 1
          fi
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify-tag.outputs.tag }}
          PRERELEASE: ${{ needs.verify-tag.outputs.prerelease }}
        run: |
          set -euo pipefail
          draft="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
          if [[ "$draft" != true ]]; then
            echo "release ${TAG} is already published; cut a new tag instead of re-running" >&2
            exit 1
          fi
          if [[ "$PRERELEASE" == true ]]; then
            gh release edit "$TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --draft=false
          fi
          echo "Published GitHub Release ${TAG} from CHANGELOG"
          echo "Image tags: version only, never latest"
