// Ezu API, version 1. The caller's namespace always comes from its
// authenticated identity; no request names one.
syntax = "proto3";

package ezu.v1;

service Ezu {
  // Insert or replace entities. Each gets its own outcome.
  rpc Upsert(UpsertRequest) returns (UpsertResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc Query(QueryRequest) returns (QueryResponse);
  rpc Status(StatusRequest) returns (StatusResponse);
  // Add or replace a fence by id.
  rpc PutFence(PutFenceRequest) returns (PutFenceResponse);
  rpc GetFence(GetFenceRequest) returns (GetFenceResponse);
  // Remove a fence; its members raise no exit events.
  rpc DeleteFence(DeleteFenceRequest) returns (DeleteFenceResponse);
  rpc ListFences(ListFencesRequest) returns (ListFencesResponse);
  // Recent fence events, oldest first.
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse);
  // Fence events from a resume point, then live as they are raised. Fails
  // with OUT_OF_RANGE when events after the resume point are no longer
  // kept. Delivery is at least once: the event id is the idempotency key.
  rpc Subscribe(SubscribeRequest) returns (stream FenceEvent);
}

// Log shipping from a leader to its followers. It carries every namespace,
// so it takes the replication token, not a tenant's credential.
service Replication {
  // Committed records after a LSN, then live as they become durable, with
  // a heartbeat at least every second. Fails with OUT_OF_RANGE when the
  // records after the LSN are no longer held (the follower needs a
  // rebuild), FAILED_PRECONDITION when the follower is ahead of this log,
  // DATA_LOSS when the follower's last record is not this log's record
  // at that LSN (it followed another history).
  rpc Follow(FollowRequest) returns (stream FollowBatch);
  // Follow, acknowledging what was applied: for a sync standby. The first
  // message is a SyncStart, every later one a SyncAck. Batches and errors
  // are those of Follow, except that a heartbeat carries the leader's
  // epoch. A leader with a sync standby counts only that node's
  // acknowledgements, and only at its own epoch.
  rpc Sync(stream SyncRequest) returns (stream FollowBatch);
}

// Longitude and latitude in WGS 84 degrees.
message Position {
  double lon = 1;
  double lat = 2;
}

message Ring {
  repeated Position positions = 1;
}

// Exterior ring first, then holes; rings are closed.
message Polygon {
  repeated Ring rings = 1;
}

message Geometry {
  oneof shape {
    Position point = 1;
    Ring line = 2;
    Polygon polygon = 3;
  }
}

message FieldValue {
  oneof value {
    bool bool_value = 1;
    int64 int_value = 2;
    double float_value = 3;
    string text_value = 4;
  }
}

message Entity {
  string collection = 1;
  string id = 2;
  Geometry geometry = 3;
  // Observation time, Unix milliseconds.
  int64 ts_ms = 4;
  optional double speed = 5;
  optional double heading = 6;
  optional int64 ttl_ms = 7;
  map<string, FieldValue> fields = 8;
  // Opaque marking labels; Ezu never interprets them.
  repeated string labels = 9;
}

// The labels a caller may read. Results, fences and events carrying any
// other label are left out. In governed mode every read must carry one;
// an empty list reads only what carries no label.
message LabelFilter {
  repeated string readable = 1;
}

message UpsertRequest {
  repeated Entity entities = 1;
}

enum Outcome {
  OUTCOME_UNSPECIFIED = 0;
  OUTCOME_INSERTED = 1;
  OUTCOME_UPDATED = 2;
  // Older than the stored entity; nothing changed.
  OUTCOME_STALE = 3;
  OUTCOME_REFUSED = 4;
}

message UpsertResult {
  Outcome outcome = 1;
  // Why a refused entity was refused.
  string error = 2;
}

message UpsertResponse {
  repeated UpsertResult results = 1;
}

message DeleteRequest {
  string collection = 1;
  string id = 2;
}

message DeleteResponse {
  bool removed = 1;
}

message GetRequest {
  string collection = 1;
  string id = 2;
  LabelFilter label_filter = 3;
}

message GetResponse {
  // Absent when the entity does not exist or has expired.
  Entity entity = 1;
}

message Bbox {
  double west = 1;
  double south = 2;
  double east = 3;
  double north = 4;
}

message Radius {
  Position center = 1;
  double meters = 2;
}

message PolygonQuery {
  Polygon polygon = 1;
  // True for entities inside the polygon, false for any that touch it.
  bool contains = 2;
}

message Nearest {
  Position center = 1;
  uint32 k = 2;
}

message Range {
  optional double min = 1;
  optional double max = 2;
}

message Filter {
  string field = 1;
  oneof test {
    FieldValue equals = 2;
    Range range = 3;
  }
}

message QueryRequest {
  string collection = 1;
  oneof query {
    Bbox bbox = 2;
    Radius radius = 3;
    PolygonQuery polygon = 4;
    Nearest nearest = 5;
  }
  repeated Filter filters = 6;
  uint32 limit = 7;
  // The next_cursor of the previous page.
  string cursor = 8;
  LabelFilter label_filter = 9;
}

message QueryResponse {
  repeated Entity entities = 1;
  string next_cursor = 2;
}

message StatusRequest {}

message StatusResponse {
  string version = 1;
  // The caller's namespace, as its identity maps it.
  string namespace = 2;
  uint64 entity_count = 3;
}

// A static geofence. An entity is inside while its geometry intersects the
// shape and it passes the selector: one of `collections` (any when empty)
// and every filter.
message Fence {
  string id = 1;
  oneof shape {
    Radius circle = 2;
    Polygon polygon = 3;
  }
  repeated string collections = 4;
  repeated Filter filters = 5;
  // Raise a dwell event once per stay, this long after entering.
  optional int64 dwell_ms = 6;
  // Raise inside events on updates while inside, at most this many per
  // second for the fence. None when absent.
  optional uint32 inside_per_second = 7;
  repeated string labels = 8;
}

message PutFenceRequest {
  Fence fence = 1;
}

message PutFenceResponse {
  bool replaced = 1;
}

message GetFenceRequest {
  string id = 1;
  LabelFilter label_filter = 2;
}

message GetFenceResponse {
  // Absent when the fence does not exist.
  Fence fence = 1;
}

message DeleteFenceRequest {
  string id = 1;
}

message DeleteFenceResponse {
  bool removed = 1;
}

message ListFencesRequest {
  // Fences after this id, in id order.
  string after_id = 1;
  uint32 limit = 2;
  LabelFilter label_filter = 3;
}

message ListFencesResponse {
  repeated Fence fences = 1;
}

enum EventKind {
  EVENT_KIND_UNSPECIFIED = 0;
  EVENT_KIND_ENTER = 1;
  EVENT_KIND_EXIT = 2;
  EVENT_KIND_INSIDE = 3;
  EVENT_KIND_DWELL = 4;
}

// An event is identified by (lsn, index): the write that raised it and its
// place among that write's events. Ids only grow.
message FenceEvent {
  uint64 lsn = 1;
  uint32 index = 2;
  string fence = 3;
  string collection = 4;
  string entity = 5;
  EventKind kind = 6;
  // The entity's observation time, Unix milliseconds.
  int64 ts_ms = 7;
  Position position = 8;
  // Both label sets, so a consumer can filter or drop the event.
  repeated string entity_labels = 9;
  repeated string fence_labels = 10;
}

message ListEventsRequest {
  // Events after this id; from the oldest kept when absent.
  optional uint64 after_lsn = 1;
  uint32 after_index = 2;
  uint32 limit = 3;
  // Only these fences' events; all when empty.
  repeated string fences = 4;
  LabelFilter label_filter = 5;
}

message SubscribeRequest {
  // Events after this id; from the oldest kept when absent.
  optional uint64 after_lsn = 1;
  uint32 after_index = 2;
  // Only these fences' events; all when empty.
  repeated string fences = 3;
  LabelFilter label_filter = 4;
}

message ListEventsResponse {
  repeated FenceEvent events = 1;
  // The id read through, past events a fence filter skipped: the next
  // request's resume point.
  optional uint64 through_lsn = 2;
  uint32 through_index = 3;
}

message FollowRequest {
  // The last LSN the follower applied.
  uint64 after_lsn = 1;
  // The follower's record at after_lsn, checked against the leader's
  // before anything is shipped. Absent before the first record, or when
  // the follower was seeded from a snapshot copy and holds no record.
  RecordFingerprint last = 2;
}

message RecordFingerprint {
  // CRC32 of the record's payload as logged.
  uint32 crc32 = 1;
  // The epoch it was logged at.
  uint64 epoch = 2;
}

message FollowBatch {
  // The epoch the records were logged at; unset in a Follow heartbeat, the
  // leader's epoch in a Sync heartbeat.
  uint64 epoch = 1;
  // Record payloads as logged, continuing the previous batch (or
  // after_lsn) without a gap. Empty in a heartbeat.
  repeated bytes records = 2;
  // The leader's last durable LSN when the batch was read.
  uint64 leader_lsn = 3;
}

message SyncRequest {
  oneof message {
    SyncStart start = 1;
    SyncAck ack = 2;
  }
}

message SyncStart {
  // The follower's node id (EZU_NODE_ID).
  string node_id = 1;
  FollowRequest follow = 2;
}

// The follower holds the leader's log through lsn, appended and synced, and
// follows epoch. Acknowledgements are cumulative; the follower repeats its
// last one on every heartbeat, which keeps the leader's lease.
message SyncAck {
  uint64 lsn = 1;
  uint64 epoch = 2;
}
