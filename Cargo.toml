[package]
name = "ezu"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
description = "Live spatial engine: an index over moving entities, spatial queries, geofencing events and recent tracks."
publish = false

[dependencies]
axum = "0.8"
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tonic = { version = "0.14", features = ["tls-connect-info"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tonic-prost = "0.14"
tokio-stream = { version = "0.1", features = ["net", "sync"] }
arrow-array = "60"
arrow-ipc = "60"
arrow-schema = "60"
crc32fast = "1"
rstar = "0.13"
aes-gcm = "0.10"
rand = "0.8"
sekai-keys = { git = "https://github.com/Sannrox/sekai-chisei.git", rev = "ab44e5da642e5f3c74c635b32607f42eb8d043b2", version = "1" }

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"

[dev-dependencies]
base64 = "0.22"
rcgen = "0.14"
