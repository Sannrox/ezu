# Dependency gate (cargo deny): permissive licenses only, no known
# advisories, crates from crates.io and the one pinned git source only.
# CI runs it on the default build and again with every feature, so an
# optional backend is checked on its own; a copyleft one would need an
# explicit per-crate exception below and must stay out of the default build.

[graph]
all-features = false

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[advisories]
yanked = "deny"
ignore = [
    # The timing leak is in RSA private-key operations. Ezu only verifies
    # JWT signatures with public keys from a JWKS and never holds an RSA
    # private key.
    { id = "RUSTSEC-2023-0071", reason = "public-key verification only" },
    # crypto-bigint 0.5 (via jsonwebtoken's p256/p384) branches on secret
    # integers. Ezu only verifies JWT signatures with public keys, so no
    # secret reaches it. Remove once jsonwebtoken moves to elliptic-curve
    # 0.14 (#50).
    { id = "RUSTSEC-2026-0387", reason = "public-key verification only (#50)" },
]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/Sannrox/sekai-chisei.git"]
